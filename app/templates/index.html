<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noteX AI — Next-Gen AI Study Assistant</title>
  <meta name="description" content="noteX AI is a modern AI-powered study platform featuring RAG chatbots, smart notes, quiz generators, and progress analytics.">
  
  <!-- Modern Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- KaTeX LaTeX Math Engine CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/glassmorphism.css">
  <link rel="stylesheet" href="/static/css/components.css">

  <!-- Chart.js & Code Highlighting CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
</head>
<body>
  <!-- Ambient Mesh Background -->
  <div class="ambient-bg"></div>

  <div class="app-wrapper">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" title="noteX AI - Chi Spark Badge">𝝌</div>
        <div class="brand-title">noteX AI</div>
      </div>
      
      <ul class="nav-list">
        <li class="nav-item active" data-view="chat">
          <a href="#chat"><i class="fa-solid fa-comments"></i> <span>AI Chat (Home)</span></a>
        </li>
        <li class="nav-item" data-view="dashboard">
          <a href="#dashboard"><i class="fa-solid fa-house"></i> <span>Dashboard</span></a>
        </li>
        <li class="nav-item" data-view="library">
          <a href="#library"><i class="fa-solid fa-folder-open"></i> <span>My Library</span></a>
        </li>
        <li class="nav-item" data-view="rag">
          <a href="#rag"><i class="fa-solid fa-file-pdf"></i> <span>PDF Assistant</span></a>
        </li>
        <li class="nav-item" data-view="notes">
          <a href="#notes"><i class="fa-solid fa-pen-to-square"></i> <span>AI Notes</span></a>
        </li>
        <li class="nav-item" data-view="study-plan">
          <a href="#study-plan"><i class="fa-solid fa-calendar-days"></i> <span>Study Planner</span></a>
        </li>
        <li class="nav-item" data-view="flashcards">
          <a href="#flashcards"><i class="fa-solid fa-layer-group"></i> <span>Flashcards</span></a>
        </li>
        <li class="nav-item" data-view="quizzes">
          <a href="#quizzes"><i class="fa-solid fa-circle-question"></i> <span>AI Quiz</span></a>
        </li>
        <li class="nav-item" data-view="analytics">
          <a href="#analytics"><i class="fa-solid fa-chart-line"></i> <span>Analytics</span></a>
        </li>
        <li class="nav-item" data-view="admin">
          <a href="#admin"><i class="fa-solid fa-user-shield"></i> <span>Admin Console</span></a>
        </li>
      </ul>
    </aside>

    <!-- Main View Shell -->
    <main class="main-content">
      <!-- Navbar -->
      <header class="top-navbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button id="classSelectorBtn" class="btn-glass-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.82rem;">
            🎓 Active Grade: <span id="currentGradeLabel" style="color: var(--accent-violet-light); font-weight: 700;">Class 10</span>
          </button>
        </div>

        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <span class="user-greeting" style="font-size: 0.88rem; color: var(--text-secondary);">Welcome, Student</span>
          <button id="logoutBtn" class="btn-glass-secondary" style="padding: 0.35rem 0.75rem; font-size: 0.82rem;">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <div id="app-view-container" class="view-container">
        <!-- SPA Module Content Loaded via app.js -->
      </div>
    </main>
  </div>

  <!-- Class Selector Modal -->
  <div id="gradeModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 1rem;">
    <div class="glass-card" style="width: 100%; max-width: 480px; padding: 1.5rem; position: relative;">
      <h3 style="font-weight: 700; margin-bottom: 1rem;">Select Target Grade</h3>
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1.5rem;">
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 1">Class 1</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 2">Class 2</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 3">Class 3</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 4">Class 4</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 5">Class 5</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 6">Class 6</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 7">Class 7</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 8">Class 8</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 9">Class 9</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 10">Class 10</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 11">Class 11</button>
        <button class="grade-opt-btn btn-glass-secondary" data-grade="Class 12">Class 12</button>
      </div>
      <button id="closeGradeModal" class="btn-glass-secondary" style="width: 100%;">Close</button>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="/static/js/config.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/modules/chatbot.js"></script>
  <script src="/static/js/modules/dashboard.js"></script>
  <script src="/static/js/modules/library.js"></script>
  <script src="/static/js/modules/rag.js"></script>
  <script src="/static/js/modules/notes.js"></script>
  <script src="/static/js/modules/study_planner.js"></script>
  <script src="/static/js/modules/flashcards.js"></script>
  <script src="/static/js/modules/quiz.js"></script>
  <script src="/static/js/modules/analytics.js"></script>
  <script src="/static/js/modules/admin.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
