version: '3.8'

services:
  web:
    build: .
    container_name: notex_web
    restart: always
    environment:
      - FLASK_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/notex_ai
      - JWT_SECRET_KEY=super-secret-production-jwt-key-2026
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - logs_data:/app/logs
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    container_name: notex_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  nginx:
    image: nginx:alpine
    container_name: notex_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  mongo_data:
  uploads_data:
  chroma_data:
  logs_data:
